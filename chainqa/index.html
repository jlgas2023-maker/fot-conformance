<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chain Infrastructure QA — FOT Conformance Suite</title>
<meta name="description" content="RPC latency, Blockscout indexing lag, and verified-source coverage for Robinhood Chain, sampled on a schedule and committed as history -- read straight from the chain, no backend.">
<style>
  :root{
    --bg:#0b0c07; --panel:#14160d; --panel2:#191c10;
    --line:#2c3019; --ink:#ece9d6; --muted:#9a9c80; --dim:#6a6c52;
    --lime:#ccff00; --ok:#54e08a; --bad:#f2584b;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
    --sans:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
  .wrap{max-width:960px;margin:0 auto;padding:26px 20px 60px}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  a{color:var(--lime)}
  h1{font-size:24px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
  table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);padding:0 10px 8px 0}
  td{padding:8px 10px 8px 0;border-top:1px solid var(--line)}
  .num{font-family:var(--mono);text-align:right}
  .ok{color:var(--ok)} .bad{color:var(--bad);font-weight:700}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:18px}
  .card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.6px}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .kpi .k{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)}
  .kpi .v{font-family:var(--mono);font-size:18px;font-weight:600;margin-top:5px}
  .note{color:var(--dim);font-size:11.5px;margin-top:8px}
  .runs{font-size:12.5px;color:var(--muted)}
  .runs td a{color:var(--muted)}
  .runs td a:hover{color:var(--lime)}
  .backlink{font-size:12.5px;color:var(--muted)}
  .notimpl{background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;color:var(--dim);font-size:12.5px;margin-top:12px}
  @media(max-width:600px){.kpis{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="backlink"><a href="../index.html">&larr; suite home</a></div>
  <h1>Chain Infrastructure QA</h1>
  <div class="sub">RPC latency, Blockscout indexing lag, and verified-source coverage for Robinhood Chain, sampled on a schedule and committed to this repo. <a href="../docs/methodology.md">Methodology</a>.</div>

  <div id="latest">loading…</div>
  <div class="card">
    <h2>Run History</h2>
    <div id="runs">loading…</div>
  </div>
</div>

<script>
const CHAIN = "robinhood";
const $ = (id) => document.getElementById(id);
const fmt = (v, d = 0) => v == null ? "--" : Number(v).toLocaleString(undefined, {maximumFractionDigits: d});

async function load() {
  const idxRes = await fetch(`history/${CHAIN}/index.json`);
  if (!idxRes.ok) { $("latest").innerHTML = `<p>no history yet</p>`; return; }
  const index = await idxRes.json();
  if (index.length === 0) { $("latest").innerHTML = `<p>no runs yet</p>`; return; }

  const latestMeta = index[index.length - 1];
  const snap = await (await fetch(`history/${CHAIN}/${latestMeta.file}`)).json();

  $("latest").innerHTML = `
    <div class="card">
      <h2>${snap.chain} — as of ${new Date(snap.fetchedAt).toLocaleString()}</h2>
      <div class="kpis">
        <div class="kpi">
          <div class="k">RPC</div>
          <div class="v ${snap.rpc.ok ? 'ok' : 'bad'}">${snap.rpc.ok ? snap.rpc.latencyMs + 'ms' : 'DOWN'}</div>
          <div class="note">${snap.rpc.ok ? `block ${fmt(snap.rpc.block)}` : snap.rpc.error}</div>
        </div>
        <div class="kpi">
          <div class="k">Indexing Lag</div>
          <div class="v ${snap.indexingLag.ok ? (snap.indexingLag.lagBlocks > 100 ? 'bad' : 'ok') : 'bad'}">${snap.indexingLag.ok ? fmt(snap.indexingLag.lagBlocks) + ' blocks' : 'unknown'}</div>
          <div class="note">${snap.indexingLag.ok ? `indexed ${fmt(snap.indexingLag.indexedBlock)} / head ${fmt(snap.indexingLag.headBlock)}` : snap.indexingLag.error}</div>
        </div>
        <div class="kpi">
          <div class="k">Verified Source (all-time)</div>
          <div class="v ${snap.verificationCoverage.ok ? '' : 'bad'}">${snap.verificationCoverage.ok ? snap.verificationCoverage.verifiedPct.toFixed(1) + '%' : 'unknown'}</div>
          <div class="note">${snap.verificationCoverage.ok ? `${fmt(snap.verificationCoverage.verifiedContracts)} / ${fmt(snap.verificationCoverage.totalContracts)}` : snap.verificationCoverage.error}</div>
        </div>
      </div>
      <div class="notimpl">Router compatibility matrix: not implemented — no known router/aggregator addresses on this chain to test against without fabricating a fixture. See <a href="README.md">chainqa/README.md</a>.</div>
    </div>
  `;

  const rows = [...index].reverse().map(r => `
    <tr>
      <td><a href="history/${CHAIN}/${r.file}" target="_blank">${new Date(r.fetchedAt).toLocaleString()}</a></td>
      <td class="num">${r.rpcOk ? `<span class="ok">ok</span> ${fmt(r.rpcLatencyMs)}ms` : '<span class="bad">down</span>'}</td>
      <td class="num">${r.indexingLagBlocks != null ? fmt(r.indexingLagBlocks) : '--'}</td>
      <td class="num">${r.verifiedPct != null ? r.verifiedPct.toFixed(1) + '%' : '--'}</td>
    </tr>`).join("");
  $("runs").innerHTML = `
    <div style="overflow-x:auto">
    <table class="runs">
      <thead><tr><th>Run</th><th class="num">RPC</th><th class="num">Indexing Lag</th><th class="num">Verified %</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
  `;
}
load();
</script>
</body>
</html>
