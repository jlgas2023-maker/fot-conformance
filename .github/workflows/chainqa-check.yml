name: Chain Infrastructure QA Check

on:
  schedule:
    # Every 3 hours -- tighter than supply-check's 6h since RPC/indexing
    # health is the kind of thing worth noticing sooner than a supply
    # figure drifting.
    - cron: "42 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: chainqa-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run chain QA check -- Robinhood Chain
        run: node chainqa/check.mjs robinhood

      - name: Commit results
        run: |
          git config user.name "fot-conformance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add chainqa/history
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chainqa check: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # See supply-check.yml's identical comment -- this repo has 3
          # independent scheduled workflows pushing to main; staggered
          # crons avoid overlap normally, but a manual workflow_dispatch
          # can still collide (confirmed live 2026-08-05).
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, rebasing onto origin/main and retrying ($i/5)..."
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
          echo "push failed after retries" >&2
          exit 1
