name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Confirmed live 2026-08-05: pushes made by supply-check/chainqa-check/
    # scanner-check's "Commit results" step use the default GITHUB_TOKEN,
    # and GitHub deliberately does NOT let GITHUB_TOKEN-authored pushes
    # trigger other workflows (anti-loop protection) -- so `on: push`
    # above only fires for human-authored commits, never for the bot's
    # scheduled data updates. Without this schedule, the live site would
    # silently freeze at whatever was true at the last human push while
    # the repo itself kept accumulating real history underneath it --
    # exactly the failure mode caught live before announcing this
    # publicly (repo had a 4th supply run committed; the site was still
    # only showing 3). Every 30 min is frequent enough that propagation
    # lag stays small next to how often the underlying checks actually
    # run (3h/6h/24h), without redeploying on every commit.
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # No build step by design (hard constraint #2 in docs/methodology.md
      # -- static hosting, deploy from a git push, nothing to compile). The
      # whole repo is the site: config/ and supply/state/ are plain JSON
      # (harmless to serve), everything else is what's meant to be public.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
