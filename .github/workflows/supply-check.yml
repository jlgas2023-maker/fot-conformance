name: Supply Conformance Check

on:
  schedule:
    # Every 6 hours. Robinhood Chain went public mainnet 2026-07-01 and this
    # suite has no way to know in advance how often external providers
    # actually refresh -- 6h is a starting guess, cheap to tighten once
    # real drift-over-time data (the point of this whole workflow) shows
    # how fast providers actually update.
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: supply-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # One line per token in config/tokens/ -- add new tokens here as they
      # get a config file. No dependency install step: supply/*.mjs is
      # deliberately dependency-free (Node's global fetch), so there is
      # nothing to `npm ci`.
      - name: Run supply check -- TACO
        run: node supply/check.mjs taco

      - name: Commit results
        run: |
          git config user.name "fot-conformance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add supply/history supply/state
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "supply check: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # This repo has 3 independent scheduled workflows that all push
          # to main; their crons are staggered to avoid overlap, but a
          # manual workflow_dispatch (or a slow runner) can still collide
          # -- confirmed live 2026-08-05, triggering all three by hand at
          # once got one push rejected as non-fast-forward. Retry with
          # rebase instead of assuming the schedule alone prevents this.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, rebasing onto origin/main and retrying ($i/5)..."
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
          echo "push failed after retries" >&2
          exit 1
