name: FOT Taxonomy Scan

on:
  schedule:
    # Daily -- unlike supply/chainqa this isn't a drift-over-time metric,
    # it's a point-in-time classification. Re-running it daily mainly
    # catches the LIVE checks changing (owner_is_zero, sim_buy/sim_sell
    # success) if something about a token's on-chain state shifts; the
    # static checks only change if the verified source itself changes,
    # which Blockscout wouldn't allow post-verification anyway.
    - cron: "13 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scanner-check
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scan TACO
        run: node scanner/scan.mjs taco

      - name: Commit results
        run: |
          git config user.name "fot-conformance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scanner/results
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "scanner: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # See supply-check.yml's identical comment -- this repo has 3
          # independent scheduled workflows pushing to main; staggered
          # crons avoid overlap normally, but a manual workflow_dispatch
          # can still collide (confirmed live 2026-08-05, this exact
          # workflow's push got rejected as non-fast-forward when all
          # three were triggered by hand within a couple seconds of
          # each other).
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, rebasing onto origin/main and retrying ($i/5)..."
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
          echo "push failed after retries" >&2
          exit 1
